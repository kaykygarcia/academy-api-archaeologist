name: api-archaeologist-dev

services:
  web:
    build:
      context: .
      target: dev
    environment:
      VITE_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - core_node_modules:/app/packages/core/node_modules
      - pnpm_store:/pnpm/store

volumes:
  root_node_modules:
  web_node_modules:
  core_node_modules:
  pnpm_store:
